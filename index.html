<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp 免存聯絡人直發工具</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 relative select-none">

  <!-- 主卡片容器 -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 my-auto">
    
    <!-- Header 頁眉 -->
    <div class="bg-gradient-to-r from-emerald-500 to-green-600 p-6 text-white text-center relative">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl mb-2 shadow-inner">
        <i class="fa-brands fa-whatsapp text-3xl"></i>
      </div>
      <h1 class="text-xl font-bold tracking-wide">WhatsApp 免存聯絡人直發工具</h1>
      <p class="text-xs text-emerald-100 mt-1 font-medium">免存聯絡人 ‧ 一秒直發訊息</p>
    </div>

    <!-- 主要內容區 -->
    <div class="p-6 space-y-5">

      <!-- 電話號碼輸入區 -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
          電話號碼
        </label>

        <div class="flex gap-2">
          <!-- 區號選擇器 -->
          <div class="relative w-1/3">
            <select id="countryCode" class="w-full h-12 pl-3 pr-8 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 appearance-none focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
              <option value="852" selected>🇭🇰 +852</option>
              <option value="853">🇲🇴 +853</option>
              <option value="886">🇹🇼 +886</option>
              <option value="86">🇨🇳 +86</option>
              <option value="1">🇨🇦/🇺🇸 +1</option>
              <option value="44">🇬🇧 +44</option>
              <option value="61">🇦🇺 +61</option>
              <option value="81">🇯🇵 +81</option>
              <option value="82">🇰🇷 +82</option>
              <option value="65">🇸🇬 +65</option>
              <option value="60">🇲🇾 +60</option>
              <option value="66">🇹🇭 +66</option>
              <option value="84">🇻🇳 +84</option>
              <option value="49">🇩🇪 +49</option>
              <option value="33">🇫🇷 +33</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
          </div>

          <!-- 輸入號碼 -->
          <div class="relative w-2/3">
            <input type="tel" id="phoneNumber" placeholder="請輸入電話號碼" 
                   class="w-full h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500 transition placeholder:text-slate-300 placeholder:font-normal select-text">
            <button id="clearPhoneBtn" onclick="clearPhone()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 p-1">
              <i class="fa-solid fa-circle-xmark"></i>
            </button>
          </div>
        </div>

        <!-- 國際格式即時預覽 -->
        <div id="phonePreview" class="text-xs text-slate-400 mt-1.5 ml-1 h-4"></div>
      </div>

      <!-- 對話訊息輸入 (選填) -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
          對話訊息 <span class="text-slate-300 font-normal">(選填)</span>
        </label>
        <textarea id="messageText" rows="3" placeholder="可以直接填寫想傳送的內容..."
                  class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition placeholder:text-slate-300 resize-none select-text"></textarea>
      </div>

      <!-- 操作按鈕區 -->
      <div class="space-y-2.5 pt-1">
        <!-- 主按鈕：開啟 WhatsApp -->
        <button onclick="openWhatsApp()" class="w-full h-12 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2 transition duration-150">
          <i class="fa-brands fa-whatsapp text-xl"></i>
          <span>開啟 WhatsApp</span>
        </button>

        <div class="grid grid-cols-2 gap-2.5">
          <!-- 複製連結 -->
          <button onclick="copyLink()" class="h-11 bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 font-semibold rounded-xl text-sm flex items-center justify-center gap-2 transition">
            <i class="fa-regular fa-copy"></i>
            <span>複製連結</span>
          </button>
          
          <!-- 二維碼 -->
          <button onclick="toggleQRCode()" class="h-11 bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 font-semibold rounded-xl text-sm flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-qrcode"></i>
            <span>顯示 QR Code</span>
          </button>
        </div>
      </div>

      <!-- QR Code 顯示區 (預設隱藏) -->
      <div id="qrContainer" class="hidden flex-col items-center justify-center p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3 transition-all">
        <div id="qrcode" class="p-2 bg-white rounded-xl shadow-sm border border-slate-100"></div>
        <p class="text-xs text-slate-400">使用相機掃瞄即刻打開對話</p>
      </div>

      <!-- 歷史紀錄 -->
      <div class="pt-3 border-t border-slate-100">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">最近發送紀錄</span>
          <button onclick="clearHistory()" id="clearHistoryBtn" class="text-xs text-rose-500 hover:underline hidden">清除紀錄</button>
        </div>
        <div id="historyList" class="space-y-1.5 max-h-36 overflow-y-auto pr-1 text-xs">
          <!-- 動態載入 -->
        </div>
      </div>

    </div>
  </div>

  <!-- 提示訊息 Toast -->
  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs py-2 px-4 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    已成功複製！
  </div>

  <!-- JavaScript 業務邏輯 -->
  <script>
    const countryCodeSelect = document.getElementById('countryCode');
    const phoneNumberInput = document.getElementById('phoneNumber');
    const messageTextInput = document.getElementById('messageText');
    const phonePreview = document.getElementById('phonePreview');
    const clearPhoneBtn = document.getElementById('clearPhoneBtn');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const qrContainer = document.getElementById('qrContainer');
    let qrcodeObj = null;

    document.addEventListener('DOMContentLoaded', () => {
      renderHistory();
      phoneNumberInput.addEventListener('input', handlePhoneInput);
    });

    // 格式化號碼
    function getCleanNumber() {
      const code = countryCodeSelect.value;
      const rawNum = phoneNumberInput.value.replace(/\D/g, '');
      if (!rawNum) return { full: '', code: '', num: '' };
      return {
        full: `${code}${rawNum}`,
        code: code,
        num: rawNum
      };
    }

    // 處理號碼輸入變更
    function handlePhoneInput() {
      const { full, num } = getCleanNumber();
      if (num.length > 0) {
        clearPhoneBtn.classList.remove('hidden');
        phonePreview.textContent = `國際格式預覽：+${full}`;
      } else {
        clearPhoneBtn.classList.add('hidden');
        phonePreview.textContent = '';
      }
    }

    function clearPhone() {
      phoneNumberInput.value = '';
      handlePhoneInput();
      phoneNumberInput.focus();
    }

    // 產生 WhatsApp URL
    function generateWALink() {
      const { full } = getCleanNumber();
      if (!full) {
        showToast('請先輸入電話號碼！');
        return null;
      }
      const msg = encodeURIComponent(messageTextInput.value.trim());
      return `https://wa.me/${full}${msg ? '?text=' + msg : ''}`;
    }

    // 開啟 WhatsApp
    function openWhatsApp() {
      const link = generateWALink();
      if (!link) return;

      const { full } = getCleanNumber();
      saveToHistory(full, messageTextInput.value.trim());
      
      window.open(link, '_blank');
    }

    // 複製對話連結
    function copyLink() {
      const link = generateWALink();
      if (!link) return;

      navigator.clipboard.writeText(link).then(() => {
        showToast('已複製 WhatsApp 連結！');
        saveToHistory(getCleanNumber().full, messageTextInput.value.trim());
      }).catch(() => {
        showToast('複製失敗，請手動複製');
      });
    }

    // 切換顯示 QR Code
    function toggleQRCode() {
      const link = generateWALink();
      if (!link) return;

      if (!qrContainer.classList.contains('hidden')) {
        qrContainer.classList.add('hidden');
        return;
      }

      const qrElement = document.getElementById('qrcode');
      qrElement.innerHTML = '';
      
      qrcodeObj = new QRCode(qrElement, {
        text: link,
        width: 140,
        height: 140,
        colorDark : "#0f172a",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.M
      });

      qrContainer.classList.remove('hidden');
    }

    // 本機歷史紀錄管理
    function getHistory() {
      return JSON.parse(localStorage.getItem('wa_direct_history') || '[]');
    }

    function saveToHistory(phone, msg) {
      if (!phone) return;
      let history = getHistory();
      history = history.filter(item => item.phone !== phone);
      history.unshift({ phone, msg, time: new Date().toLocaleDateString('zh-HK') });
      if (history.length > 5) history.pop();
      localStorage.setItem('wa_direct_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = getHistory();
      historyList.innerHTML = '';
      
      if (history.length === 0) {
        historyList.innerHTML = `<div class="text-slate-300 text-center py-2">暫無發送紀錄</div>`;
        clearHistoryBtn.classList.add('hidden');
        return;
      }

      clearHistoryBtn.classList.remove('hidden');
      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-2 bg-slate-50 hover:bg-slate-100 rounded-lg cursor-pointer group transition';
        div.innerHTML = `
          <div onclick="applyHistory('+${item.phone}')" class="flex-1 min-w-0 pr-2">
            <div class="font-medium text-slate-700 font-mono text-xs">+${item.phone}</div>
            ${item.msg ? `<div class="text-[10px] text-slate-400 truncate">${item.msg}</div>` : ''}
          </div>
          <button onclick="removeHistoryItem('${item.phone}')" class="text-slate-300 hover:text-rose-500 p-1">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        `;
        historyList.appendChild(div);
      });
    }

    function applyHistory(fullPhone) {
      const numStr = fullPhone.replace('+', '');
      const options = Array.from(countryCodeSelect.options).map(o => o.value);
      let matchedCode = '852';
      let restNum = numStr;

      for (let code of options) {
        if (numStr.startsWith(code)) {
          matchedCode = code;
          restNum = numStr.substring(code.length);
          break;
        }
      }

      countryCodeSelect.value = matchedCode;
      phoneNumberInput.value = restNum;
      handlePhoneInput();
      showToast('已填入紀錄號碼');
    }

    function removeHistoryItem(phone) {
      let history = getHistory().filter(item => item.phone !== phone);
      localStorage.setItem('wa_direct_history', JSON.stringify(history));
      renderHistory();
    }

    function clearHistory() {
      if (confirm('確定要清除所有歷史發送紀錄？')) {
        localStorage.removeItem('wa_direct_history');
        renderHistory();
      }
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }
  </script>
</body>
</html>
